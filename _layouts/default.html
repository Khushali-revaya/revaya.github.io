---
layout: default
---
<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
    {% if site.google_analytics %}      
        <!-- Google Analytics -->
        <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', '{{ site.google_analytics }}');
        </script>
    {% endif %}
    
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    
    <!-- Styles -->
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Belleza&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'Higuen Elegant Serif';
            src: url('/assets/fonts/higuen-elegant-serif.woff2') format('woff2'),
                 url('/assets/fonts/higuen-elegant-serif.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background-color: #e29898; /* Pink background */
            color: #f6f3f2; /* Off-white text */
            font-family: 'Belleza', sans-serif;
        }

        .wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header, footer {
            background-color: transparent;
            padding: 10px;
            text-align: center;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Higuen Elegant Serif', serif;
            color: #f6f3f2;
        }

        th {
            color: #f6f3f2;
        }

        a {
            color: #ffffff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
            color: #ffe0e0;
        }

        .social-icons a {
            margin-right: 15px;
            color: #f6f3f2;
        }

        .social-icons a:hover {
            color: #ffffff;
        }

        img {
            max-width: 120px;
            margin: 10px 0;
        }
    </style>

    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
</head>
<body>
    <div class="wrapper">
        <header>
            <h1><a href="{{ "/" | absolute_url }}">{{ site.title | default: site.github.repository_name
