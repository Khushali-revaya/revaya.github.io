---
layout: default
---
<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
    {% if site.google_analytics %}      
        <!-- Google Analytics -->
        <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', '{{ site.google_analytics }}');
        </script>
    {% endif %}
    
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    
    <!-- Styles -->
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Belleza&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'Higuen Elegant Serif';
            src: url('/assets/fonts/higuen-elegant-serif.woff2') format('woff2'),
                 url('/assets/fonts/higuen-elegant-serif.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
        
        body {
            background-color: #f6f3f2; /* Off-white background color */
            color: #333333; /* Dark font color for better readability */
            font-family: 'Belleza', sans-serif;
        }
        .wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        header, footer {
            background-color: #f6f3f2; /* Off-white background color */
            padding: 10px;
            text-align: center;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Higuen Elegant Serif', serif;
            color: #e29898; /* Pink color for headers */
        }
        th {
            color: #e29898; /* Pink color for table headers */
        }
        a {
            color: #e29898; /* Pink link color */
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .social-icons a {
            margin-right: 15px;
            color: #e29898; /* Pink icon color */
        }
        .social-icons a:hover {
            color: #d08080; /* Slightly darker pink on hover */
        }
    </style>
    <!--[if lt IE 9]>
    <!-- HTML5 Shiv for IE compatibility -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
</head>
<body>
    <div class="wrapper">
        <header>
            <!-- Site Title and Logo -->
            <h1><a href="{{ "/" | absolute_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>
            {% if site.logo %}
                <img src="{{site.logo | relative_url}}" alt="Logo" />
            {% endif %}
            
            <!-- Site Description -->
            <p>{{ site.description | default: site.github.project_tagline }}</p>
        </header>
        <section>
            {{ content }}
        </section>
        <footer>
            <!-- Social Icons -->
            <p class="social-icons">
                <a href="https://www.linkedin.com/company/revaya/" target="_blank" rel="noopener"><i class="fab fa-linkedin fa-2x"></i></a>
                <a href="https://www.instagram.com/revaya.life?igsh=dXNndHMweWZramk2" target="_blank" rel="noopener"><i class="fab fa-instagram fa-2x"></i></a>
                <a href="https://www.facebook.com/share/15namE334b/" target="_blank" rel="noopener"><i class="fab fa-facebook fa-2x"></i></a>
                <a href="mailto:khushali@revaya.life"><i class="fas fa-envelope fa-2x"></i></a>
            </p>
        </footer>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
</body>
</html>
